<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouli's Board</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
        <h1> Trouli's Board </h1>

        <div id="highscore">Highscore: 0 </div>

        <div class = "tasks-done-counter">
            <h2 id="counttasks"></h2>
        </div>

        <div class = "add-task">
            <input type="text" id="addtask" placeholder="Add a task">
            <button onclick="addTask()">Add Task</button>
        </div>

        <div class = "board">
            <div class = "column todo">
                <h3> To Do </h3>
                <div class = "task-list" 
                    id = "todo" 
                    ondrop = "drop(event)" 
                    ondragover = "allowDrop(event)">
                </div>
            </div>
            <div class = "column current">
                <h3> Current Sprint </h3>
                <div class = "task-list" 
                    id = "current" 
                    ondrop = "drop(event)" 
                    ondragover = "allowDrop(event)">
                </div>
            </div>
            <div class = "column progress">
                <h3> In Progress </h3>
                <div class = "task-list" 
                    id = "progress" 
                    ondrop = "drop(event)" 
                    ondragover = "allowDrop(event)">
                </div>
            </div>
                <div class = "column done">
                <h3> Done! </h3>
                <div class = "task-list" 
                    id = "done" 
                    ondrop = "drop(event)" 
                    ondragover = "allowDrop(event)">
                </div>
            </div>
        </div>
    
        <script src="static/script.js"></script>
    </body>
</html>
